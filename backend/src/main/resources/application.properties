# ============================================================
# APPLICATION NAME
# ============================================================
spring.application.name=re-cycle-tech-backend

# ============================================================
# SERVER
# ============================================================
server.port=8000

# ============================================================
# DATABASE (PostgreSQL)
# ------------------------------------------------------------
# CORRECCIÓN (hallazgo Fase 2 "Seguridad de evidencias"): usuario y
# contraseña ya NO están fijos en este archivo versionado. Se leen de
# variables de entorno; los valores tras ":" son SOLO un fallback para
# levantar el entorno de demo local (docker-compose) y deben cambiarse en
# cualquier entorno real. El valor "secret" que estuvo hardcodeado aquí
# debe considerarse comprometido y rotarse en la base de datos real.
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recycle_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ============================================================
# FLYWAY (Migraciones) - Deshabilitar
# ------------------------------------------------------------
# database/schema.sql contiene el DDL versionado y reproducible (ver README).
# Se recomienda migrar a Flyway en una fase futura para no depender de
# hibernate.ddl-auto=update en un entorno productivo.
# ============================================================
spring.flyway.enabled=false

# ============================================================
# THYMELEAF - Deshabilitar advertencia (no se usa)
# ============================================================
spring.thymeleaf.check-template-location=false

# ============================================================
# JWT (Configuración)
# ------------------------------------------------------------
# CORRECCIÓN: la clave de firma ya no queda fija en el archivo versionado.
# El valor de fallback es SOLO para demo local; la clave anterior
# git y debe tratarse como comprometida (rotarla en cualquier despliegue real).
# ============================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================================
# SWAGGER / OPENAPI (Configuración completa)
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.recycle.controller
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=method

# ============================================================
# SQL INIT - Cargar datos iniciales
# ============================================================
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
