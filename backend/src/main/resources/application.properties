# ============================================================
# APPLICATION NAME
# ============================================================
spring.application.name=re-cycle-tech-backend

# ============================================================
# SERVER
# ============================================================
server.port=8000

# ============================================================
# DATABASE (PostgreSQL)
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/recycle_db
spring.datasource.username=admin
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ============================================================
# FLYWAY (Migraciones) - Deshabilitar
# ============================================================
spring.flyway.enabled=false

# ============================================================
# THYMELEAF - Deshabilitar advertencia (no se usa)
# ============================================================
spring.thymeleaf.check-template-location=false

# ============================================================
# JWT (Configuración)
# ============================================================
jwt.secret=miClaveSecretaSuperSegura1234567890
jwt.expiration=86400000

# ============================================================
# SWAGGER / OPENAPI (Configuración completa)
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.recycle.controller
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=method

# ============================================================
# SQL INIT - Cargar datos iniciales
# ============================================================
spring.sql.init.mode=always
spring.sql.init.platform=postgresql 